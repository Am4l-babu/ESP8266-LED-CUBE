; PlatformIO Configuration for 4x4x4 LED Cube
; ESP8266 NodeMCU with LittleFS

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; CPU and upload settings
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 921600

; LittleFS filesystem
board_build.filesystem = littlefs

; Library dependencies
; Using ESP8266's built-in WebServer + WebSocketsServer for reliability
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^6.21.5

; Build flags
build_flags =
    -D LED_CUBE_VERSION='"1.0.0"'
    -D CUBE_SIZE=4
